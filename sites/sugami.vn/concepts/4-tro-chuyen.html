<style>
  :root {
    --rose: #f16185; --rose-deep: #d9466c; --blush: #f1a9b7;
    --teal: #57c9c9; --teal-deep: #168f97; --sun: #f0e761; --maroon: #641214;
    --ink: #1d1720; --ink-2: #4a4150; --muted: #7a7080; --line: rgba(29,23,32,.08);
    --bg: #fbf8fa; --glass: rgba(255,255,255,.62); --glass-line: rgba(255,255,255,.9);
    --shadow: 0 1px 2px rgba(29,23,32,.04), 0 18px 50px -20px rgba(80,20,40,.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Be Vietnam Pro", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .glass { background: var(--glass); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
  .ambient { position: fixed; inset: 0; z-index: -1; background: radial-gradient(700px 520px at 0% 0%, rgba(135,209,214,.55), transparent 65%), radial-gradient(700px 520px at 100% 30%, rgba(241,169,183,.6), transparent 65%), radial-gradient(600px 400px at 40% 100%, rgba(240,231,97,.3), transparent 65%); }

  .app { height: 100%; display: grid; grid-template-columns: minmax(320px, 42%) 1fr; }

  /* Left: the brand side */
  .side { position: relative; padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; }
  .brand img { height: 44px; }
  .side h1 { font-size: clamp(44px, 5.4vw, 84px); line-height: .95; letter-spacing: -.05em; margin: 0 0 20px; font-weight: 900; text-wrap: balance; }
  .grad { background: linear-gradient(100deg, var(--rose-deep), var(--rose) 40%, var(--teal-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .side p { margin: 0; color: var(--ink-2); font-size: 16.5px; line-height: 1.65; max-width: 440px; }
  .legal { font-size: 13px; color: var(--muted); display: grid; gap: 14px; }
  .icons { display: flex; gap: 8px; }
  .icons a { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; transition: transform .2s; }
  .icons a:hover { transform: translateY(-3px); }
  .icons svg { width: 20px; height: 20px; }
  .shopee { background: linear-gradient(135deg, #ff7a45, #ee4d2d); } .tiktok { background: linear-gradient(135deg, #2b2b2b, #000); }
  .facebook { background: linear-gradient(135deg, #3b8cff, #1668e3); } .zalo { background: linear-gradient(135deg, #3896ff, #0068ff); }
  .lrn { background: linear-gradient(135deg, #f6ec85, var(--rose)); color: var(--maroon) !important; }

  /* Right: the conversation */
  .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 20px 20px 20px 0; }
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; }
  .head { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.4); }
  .av { width: 42px; height: 42px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); flex: none; }
  .av img { width: 36px; }
  .head b { display: block; font-size: 15px; }
  .head small { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .head small::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #2fbf71; }
  .head .reset { margin-left: auto; font: 600 13px/1 "Be Vietnam Pro", sans-serif; border: 1px solid var(--line); background: rgba(255,255,255,.7); padding: 9px 12px; border-radius: 10px; cursor: pointer; color: var(--ink-2); }

  .log { flex: 1; overflow-y: auto; padding: 24px 22px 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .row { display: flex; gap: 10px; align-items: flex-end; animation: in .45s cubic-bezier(.2,.9,.3,1.1) both; }
  .row.me { justify-content: flex-end; }
  .row .av { width: 30px; height: 30px; } .row .av img { width: 26px; }
  .row.cont .av { visibility: hidden; }
  @keyframes in { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  .bub { max-width: min(520px, 78%); padding: 12px 16px; border-radius: 20px 20px 20px 6px; font-size: 15.5px; line-height: 1.55; background: rgba(255,255,255,.85); border: 1px solid var(--glass-line); box-shadow: 0 6px 20px -14px rgba(29,23,32,.35); }
  .me .bub { border-radius: 20px 20px 6px 20px; background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: #fff; border: 0; }
  .bub b { font-weight: 700; }
  .typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5; animation: dot 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-4px); opacity: 1; } }

  /* Rich replies */
  .rich { max-width: min(560px, 86%); }
  .cards { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; }
  .pc { flex: none; width: 150px; scroll-snap-align: start; border-radius: 16px; background: rgba(255,255,255,.88); border: 1px solid var(--glass-line); overflow: hidden; box-shadow: 0 6px 20px -14px rgba(29,23,32,.35); }
  .pc .ph { height: 104px; display: grid; place-items: center; }
  .pc .ph svg { width: 40px; height: 40px; color: rgba(29,23,32,.55); }
  .pc b { display: block; font-size: 13px; padding: 9px 11px 2px; }
  .pc small { display: block; font-size: 12px; color: var(--muted); padding: 0 11px 10px; }
  .p1 { background: linear-gradient(135deg, #fde3e9, #f6c2ce); } .p2 { background: linear-gradient(135deg, #dcf3f4, #b2e2e6); }
  .p3 { background: linear-gradient(135deg, #fbf7d0, #f1e686); } .p4 { background: linear-gradient(135deg, #ece5fb, #d3c5f4); }
  .p5 { background: linear-gradient(135deg, #e2f4ee, #bfe6d7); } .p6 { background: linear-gradient(135deg, #fde8dc, #f6c8ae); }
  .svc { display: grid; gap: 8px; }
  .svc div { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.88); border: 1px solid var(--glass-line); }
  .svc i { width: 36px; height: 36px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; font-style: normal; }
  .svc i svg { width: 18px; height: 18px; }
  .svc b { display: block; font-size: 14.5px; } .svc small { color: var(--muted); font-size: 13px; }
  .chgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chgrid a { display: flex; align-items: center; gap: 10px; padding: 11px; border-radius: 16px; background: rgba(255,255,255,.88); border: 1px solid var(--glass-line); font-weight: 600; font-size: 14px; transition: transform .2s; }
  .chgrid a:hover { transform: translateY(-2px); }
  .chgrid span { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
  .chgrid svg { width: 18px; height: 18px; }
  .learnc { border-radius: 20px; padding: 20px; color: #fff; background: radial-gradient(300px 200px at 100% 0%, rgba(87,201,201,.4), transparent 70%), linear-gradient(135deg, #2a1d30, #1a1220); }
  .learnc b { font-size: 18px; display: block; margin-bottom: 6px; }
  .learnc p { margin: 0 0 14px; color: rgba(255,255,255,.72); font-size: 14px; line-height: 1.55; }
  .learnc a { display: inline-block; padding: 10px 14px; border-radius: 11px; background: linear-gradient(135deg, #f6ec85, var(--sun)); color: var(--maroon); font-weight: 700; font-size: 13.5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px 18px; border-top: 1px solid var(--line); background: rgba(255,255,255,.35); }
  .chips button { font: 600 14px/1 "Be Vietnam Pro", sans-serif; padding: 11px 15px; border-radius: 999px; border: 1px solid rgba(217,70,108,.25); background: rgba(255,255,255,.85); color: var(--rose-deep); cursor: pointer; transition: transform .2s, background .2s, color .2s; }
  .chips button:hover { background: var(--rose); color: #fff; transform: translateY(-2px); }
  .chips button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .chips button.used { color: var(--muted); border-color: var(--line); }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .side { padding: 16px 16px 6px; }
    .side h1, .side p, .legal { display: none; }
    .side .top-row { display: flex; justify-content: space-between; align-items: center; }
    .side .mini-icons { display: flex; }
    .chat { padding: 8px 10px 10px; }
    .panel { border-radius: 22px; }
    .head { padding: 12px 14px; }
    .log { padding: 16px 12px 8px; }
    .bub { max-width: 86%; font-size: 15px; }
    .chips { padding: 10px 12px 12px; flex-wrap: nowrap; overflow-x: auto; }
    .chips button { flex: none; }
  }
  .mini-icons { display: none; gap: 6px; }
  .mini-icons a { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
  .mini-icons svg { width: 17px; height: 17px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .log { scroll-behavior: auto; } }
</style>

    { q: 'Quà cho công ty', a: [
      'Sugami nhận chuẩn bị quà cho nhân viên và con em nhân viên dịp Tết, Trung thu, 1/6 hay sinh nhật công ty.',
      'Bạn gửi số lượng, ngân sách và ngày cần hàng qua <a href="https://zalo.me/" target="_blank" rel="noopener" style="color:var(--rose-deep);font-weight:700">Zalo của Sugami</a>, chúng mình gửi phương án và báo giá trong ngày làm việc, có xuất hóa đơn VAT.'] },
    { q: 'Cho bé học & chơi', a: [
      'Sugami có một sân chơi riêng cho các bé:',
      { t: 't-learn' }] }
  ];

  function wait(ms) { return new Promise(function (r) { setTimeout(r, reduce ? 0 : ms); }); }
  function scroll() { log.scrollTop = log.scrollHeight; }
  function avatar() { return '<span class="av"><img src="../assets/logo.png" alt=""></span>'; }

  function addRow(html, who, cont, rich) {
    var row = document.createElement('div');
    row.className = 'row' + (who === 'me' ? ' me' : '') + (cont ? ' cont' : '');
    row.innerHTML = (who === 'me' ? '' : avatar()) + '<div class="' + (rich ? 'rich' : 'bub') + '">' + html + '</div>';
    log.appendChild(row); scroll(); return row;
  }
  function typing(cont) { return addRow('<span class="typing"><i></i><i></i><i></i></span>', 'bot', cont); }

  async function say(list) {
    for (var i = 0; i < list.length; i++) {
      var m = list[i], t = typing(i > 0);
      await wait(typeof m === 'string' ? Math.min(1100, 380 + m.length * 6) : 600);
      t.remove();
      if (typeof m === 'string') addRow(m, 'bot', i > 0);
      else addRow(document.getElementById(m.t).innerHTML, 'bot', i > 0, true);
      await wait(220);
    }
  }

  function renderChips() {
    chipsEl.innerHTML = '';
    TOPICS.forEach(function (tp, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = tp.q;
      if (used[i]) b.className = 'used';
      b.onclick = function () { ask(i); };
      chipsEl.appendChild(b);
    });
  }

  async function ask(i) {
    if (busy) return; busy = true; used[i] = 1; renderChips();
    addRow(TOPICS[i].q, 'me');
    await wait(300);
    await say(TOPICS[i].a);
    busy = false;
  }

  async function start() {
    log.innerHTML = ''; used = {}; renderChips();
    // The greeting is visible straight away; the rest types in.
    addRow('Chào bạn, mình là <b>Sugami</b>.', 'bot');
    await say(['Chúng mình bán sỉ, bán lẻ đồ chơi trẻ em, quà tặng và dụng cụ văn phòng.', 'Bạn muốn tìm hiểu điều gì? Chọn một câu bên dưới nhé.']);
  }
  document.getElementById('reset').onclick = function () { if (!busy) start(); };
  start();
})();
</script>
</body>
</html>
