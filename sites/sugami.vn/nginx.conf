# Static homepage for sugami.vn, served by the `homepage` service in docker-compose.yml.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Design drafts and tooling stay in the repo but are not public.
  location ~ ^/(concepts|tools)/ { return 404; }
  location ~ ^/(README\.md|nginx\.conf)$ { return 404; }

  location /assets/ { expires 7d; add_header Cache-Control "public"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ =404; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
