name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: sugami
          MYSQL_USER: sugami
          MYSQL_PASSWORD: sugami-ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: mysql://sugami:sugami-ci@127.0.0.1:3306/sugami
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Apply migrations to a fresh MySQL
        run: pnpm db:deploy
      - name: Seed (idempotent)
        run: pnpm db:seed && pnpm db:seed
      - name: Test (unit + MySQL integration)
        run: pnpm test
